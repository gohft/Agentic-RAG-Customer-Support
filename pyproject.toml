    "langchain-text-splitters>=1.1.2",
    "litellm>=1.101.0",
    "ollama>=0.6.2",
    "omegaconf>=2.3.1",
    "pandas>=3.0.6",
    "pypdf>=6.18.1",
    "ragas>=0.4.3",
    "rapidfuzz>=3.14.6",
    "sentence-transformers>=6.0.1",
    "torch>=2.11.0",
    "transformers>=5.17.0",
